right_format = """$battery$time"""
command_timeout = 3600
# Prompt: param 2 └─
[character]
success_symbol = " [❯ ](#a9a1e1)"
error_symbol = " [❯ ](#ff6c6b)"
vicmd_symbol = "[  ](#98be65)"

# Username
[username]
show_always   = true
format = "[⌈](fg:#7A9C61)[  $user ](fg:#98c379 bold)[⌋](fg:#7A9C61) "
style_user    = "bold green"
style_root    = "bold red"


[hostname]
ssh_only = false
format = "<[$hostname]($style)>"
trim_at = "-"
style = "dimmed white"
disabled = true

[battery]
full_symbol = "􀛨"
charging_symbol = "􀢋"
discharging_symbol = "􀛨"
unknown_symbol = "󰁼"
disabled = false
format = "[⌈ $symbol  $percentage ⌋]($style)"
[[battery.display]]
threshold = 15
style = "fg:#e06c75"
discharging_symbol = "􀛪"

[[battery.display]]
threshold = 30
style = "fg:#e06c75"
discharging_symbol = "􀛩"

[[battery.display]]
threshold = 60
style = "fg:#e5c07b"
discharging_symbol = "􀺶"

[[battery.display]]
threshold = 80
style = "fg:#98c379"
discharging_symbol = "􀺸"

[[battery.display]]
threshold = 100
style = "fg:#98c379"
discharging_symbol = "􀛨"

# Last param in the first line/row
[cmd_duration]
disabled = true
min_time = 1
format = "[⌈](fg:#9088c8)[  $duration ]($style)[⌋](fg:#a9a1e1) "
style = "fg:#a9a1e1"

# Third param
[directory]
format = "[⌈](fg:#d19a66)[  $path ]($style)[⌋](fg:#e5c07b) "
style = "fg:#e5c07b"
truncation_length = 3
truncate_to_repo=false

[git_branch]
format = "[⌈](fg:#7A9C61)[  $branch ]($style)[⌋](fg:#98c379) "
style = "fg:#98c379"

[git_commit]
format = "[\\($hash\\)]($style) [\\($tag\\)]($style)"
style = "green"

[git_status]
format = "[⌈](fg:#3896d6)[  $all_status$ahead_behind ](fg:#51afef)[⌋](fg:#51afef)"
conflicted = "="
ahead =	"⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "
style =	"red"
disabled = false

[git_state]
rebase = "REBASING"
merge =	"MERGING"
revert = "REVERTING"
cherry_pick = "CHERRY-PICKING"
bisect = "BISECTING"
am = "AM"
am_or_rebase = "AM/REBASE"
style =	"yellow"
format = '\([$state( $progress_current/$progress_total)]($style)\) '
disabled = false

[hg_branch]
symbol = ""
style = "purple"
format = "on [$symbol$branch]($style) "

[time]
style = "fg:#51afef"
format = "[⌈](fg:#3896d6)[  $time ]($style)[⌋](fg:#51afef)"
time_format = "%R"
disabled = false

[aws]
disabled = true

[docker_context]
disabled=true
symbol = " "

[c]
disabled=true

[conda]
disabled=true
symbol = " "

[dart]
disabled=true
symbol = " "

[package]
disabled=true
symbol = " "

[perl]
disabled=true
symbol = " "

[php]
disabled=true
symbol = " "

[ruby]
disabled=true
symbol = " "

[java]
disabled=true
symbol = " "

[lua]
disabled=true
symbol = " "
style = "bold blue"

[nodejs]
disabled = false
symbol   = ""  # Nerd-Font Node.js logo
style    = "bold blue"
format = "[⌈](fg:#61afef)[ $symbol $version ](fg:#78c4fd)[⌋](fg:#61afef) "

[swift]
disabled=false
symbol = "ﯣ "

[julia]
disabled=true
format = "[$symbol$version]($style) "
symbol = "ஃ "
style = "bold green"

[python]
disabled=false
format = ' via [${symbol}${pyenv_prefix}${version}( $virtualenv)]($style) '
symbol = " "
style = "italic Blue"

[rust]
disabled=true
format = "[$symbol$version]($style) "
# style = "bold green"
symbol = " "

# Prompt: optional param 1
